<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ADI-2 volume</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { font: 13px/1.3 "Inter", "Cantarell", "Noto Sans", system-ui, sans-serif; color: #eef0f2; -webkit-font-smoothing: antialiased; }
    .box {
      position: absolute; inset: 4px;
      background: rgba(22, 25, 29, .94);
      border: 1px solid #343a42;
      border-radius: 14px;
      padding: 12px 16px;
      display: flex; flex-direction: column; justify-content: center; gap: 8px;
    }
    .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .t { color: #9aa1aa; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .v { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bar { height: 6px; border-radius: 3px; background: #2b3037; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: #f08a24; border-radius: 3px; transition: width .08s; }
    .muted .bar i { background: #6b727b; }
    .muted .v { color: #e5533d; }
  </style>
</head>
<body>
  <div class="box" id="box">
    <div class="top"><span class="t" id="t">ADI-2</span><span class="v" id="v"></span></div>
    <div class="bar" id="bar"><i id="fill"></i></div>
  </div>
  <script src="osd.js"></script>
</body>
</html>

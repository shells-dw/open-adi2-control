[package]
name = "open-adi2-control"
version = "0.2.1"
description = "Remote control for RME ADI-2 series converters on Linux"
authors = ["shells-dw"]
license = "GPL-3.0-or-later"
repository = "https://github.com/shells-dw/open-adi2-control"
homepage = "https://github.com/shells-dw/open-adi2-control"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alsa = "0.9"
tungstenite = "0.24"
mdns-sd = "0.13"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
url = "2"
libc = "0.2"
tauri-plugin-dialog = "2"
quick-xml = "0.37"
ureq = { version = "2", default-features = false, features = ["tls", "json", "proxy-from-env"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
